name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Opt-in, because this job cannot succeed unless the Claude Code GitHub App
    # is installed on the natverse org: without it the action exits 1 with
    # "Claude Code is not installed on this repository", which has made every
    # pull request red since the workflow was added in May 2026. The
    # CLAUDE_CODE_OAUTH_TOKEN secret is already set, so installing the App at
    # https://github.com/apps/claude is the only missing piece.
    #
    # To turn this on, set the repository variable ENABLE_CLAUDE_REVIEW to
    # "true" (Settings > Secrets and variables > Actions > Variables). No code
    # change needed. Until then the job is skipped rather than failed.
    if: ${{ vars.ENABLE_CLAUDE_REVIEW == 'true' }}

    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

